name: pages

# The site is site/, drawn with the UI kit in assets/ui and the logo in assets/logo. site/kit and
# site/logo are links to those two folders, so the page opens straight from disk; the job copies
# site/ with the links followed, and that copy is what GitHub Pages serves.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/ui/**'
      - 'assets/logo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy the site, the kit and the logo in
        run: |
          cp -RL site _site
          test -f _site/kit/foundation/pixel.js
          test -f _site/logo/cartridge-logo.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
