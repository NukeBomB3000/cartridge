<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartridge</title>
<!--
  The cartridge title logo, drawn as SVG by the script below.

  Opened as is, it fills the window. With ?w=640&h=480&logo=414 it is framed for a fixed screen
  instead: a w x h page with the logo `logo` pixels wide in the middle, and &pixel=2 lays it out
  for pixel art at half size. bootlogo.sh renders the boot logos from it that way (`task
  bootlogos:logo` for every panel), so the page's background is the boot screen's.

  That background is the shelf's own by default: the grid in Night, a 2px line every 40px from
  the top left corner, the colour lifted 9% toward white (cartridge-ui's backdrop.rs). Set --grid
  to transparent for the plain colour.
-->
<style>
  :root { --bg: #050508; --grid: #1c1c1e; --grid-step: 40px; --grid-line: 2px; }
  html {
    background-color: var(--bg);
    background-image:
      linear-gradient(to right, var(--grid) var(--grid-line), transparent var(--grid-line)),
      linear-gradient(to bottom, var(--grid) var(--grid-line), transparent var(--grid-line));
    background-size: var(--grid-step) var(--grid-step);
  }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  svg { width: 100%; max-width: 1200px; height: auto; display: block; }
</style>
</head>
<body>
<svg id="logo" viewBox="205 10 700 430" role="img" aria-label="Cartridge"></svg>
<script>
// Letter shapes traced from the Mega Man Zero 2 artwork. Each glyph is a list of
// rings (outer contour plus any counters), with x measured from its left edge.
const GLYPHS = {"O":[[[81.3,168.4],[45.5,168.1],[27.0,189.4],[0.0,257.9],[1.3,275.4],[2.8,278.6],[37.3,278.9],[57.8,257.6],[84.5,189.1]],[[64.3,192.1],[66.3,194.1],[42.8,254.4],[40.8,255.6],[19.8,255.4],[18.3,252.6],[40.8,193.6],[43.3,191.9]]],"M":[[[101.5,168.6],[83.0,169.1],[51.5,228.6],[47.5,233.6],[46.2,233.4],[46.0,230.9],[61.0,168.9],[41.7,169.1],[0.7,273.4],[0.0,278.9],[9.0,279.4],[11.2,277.6],[31.5,226.6],[33.0,230.4],[23.0,276.9],[25.7,279.4],[32.7,279.4],[35.5,277.9],[64.5,228.1],[66.7,226.4],[68.0,228.6],[49.0,278.4],[51.0,279.4],[60.2,278.4],[101.5,172.1]]],"E":[[[91.5,168.6],[43.2,168.4],[42.0,169.4],[0.0,278.6],[50.7,278.6],[49.5,255.9],[47.2,254.6],[24.0,254.4],[23.7,250.9],[30.5,235.4],[52.0,234.6],[54.7,230.1],[60.5,212.6],[42.5,212.1],[40.0,210.1],[46.2,192.9],[48.7,191.4],[73.7,191.1],[90.7,171.4]]],"G":[[[79.8,168.6],[45.3,168.4],[26.8,189.4],[0.0,257.1],[2.5,278.9],[36.3,279.1],[54.8,258.6],[69.8,220.9],[69.5,217.1],[39.3,216.9],[37.0,217.9],[46.8,235.9],[46.5,240.6],[41.3,253.6],[39.5,255.4],[20.5,255.4],[17.8,254.1],[17.0,252.1],[40.8,192.1],[62.0,191.6],[64.5,194.6],[59.5,208.1],[74.3,208.4],[82.0,188.6]]],"A":[[[75.3,168.6],[59.8,168.1],[53.5,169.6],[0.3,275.4],[0.0,278.9],[12.0,279.1],[20.3,263.4],[23.3,260.6],[34.0,260.6],[35.8,262.9],[32.5,278.9],[45.5,278.6]],[[49.8,205.6],[51.3,209.1],[44.0,235.4],[42.0,237.1],[36.5,237.1],[34.8,233.9]]],"Z":[[[94.0,168.4],[44.5,168.1],[43.0,169.1],[35.2,190.4],[64.5,190.9],[66.5,193.1],[8.7,254.9],[0.0,276.4],[0.2,278.6],[51.7,279.1],[54.0,277.6],[61.0,259.6],[61.0,256.4],[29.7,256.1],[28.7,252.6],[86.0,191.4]]],"Ez":[[[92.7,168.6],[42.7,168.1],[41.2,169.4],[0.0,275.4],[0.0,278.9],[48.0,279.4],[51.5,277.6],[58.0,261.4],[58.7,256.4],[26.0,256.1],[24.7,254.9],[25.0,250.9],[33.0,233.1],[56.7,232.6],[60.0,230.4],[66.2,212.9],[42.2,211.4],[41.5,208.4],[47.7,192.6],[49.7,190.9],[84.5,190.6]]],"R":[[[89.5,168.4],[41.5,168.9],[0.3,274.6],[0.0,278.6],[12.0,279.4],[15.3,276.6],[47.8,192.4],[50.8,190.9],[68.0,190.9],[70.5,193.1],[73.0,199.1],[68.5,211.6],[56.5,219.9],[41.8,220.1],[40.8,221.1],[45.3,277.4],[48.8,279.4],[60.8,279.4],[63.3,278.1],[60.0,236.1],[63.0,232.6],[78.3,222.9],[93.8,183.9]]]};

// Letters the artwork never had, drawn to match it: C is G without its bar, D is O squared off
// on the left, I and T take the stems' width and slant.
Object.assign(GLYPHS, {
  C: [[[79.8,168.6],[45.3,168.4],[26.8,189.4],[0.0,257.1],[2.5,278.9],[36.3,279.1],[54.8,258.6],[60.6,244.0],[44.8,244.0],[41.3,253.6],[39.5,255.4],[20.5,255.4],[17.8,254.1],[17.0,252.1],[40.8,192.1],[62.0,191.6],[64.5,194.6],[59.5,208.1],[74.3,208.4],[82.0,188.6]]],
  D: [[[42.0,168.4],[86.3,168.4],[89.5,189.1],[62.8,257.6],[42.3,278.9],[0.0,278.9]],
      [[49.0,191.9],[69.3,192.1],[71.3,194.1],[47.8,254.4],[45.8,255.6],[25.5,255.4]]],
  I: [[[42.5,168.4],[63.5,168.4],[21.0,278.9],[0.0,278.9]]],
  T: [[[45.0,168.4],[96.0,168.4],[88.0,190.9],[69.0,190.9],[35.0,278.9],[14.0,278.9],[48.0,190.9],[37.0,190.9]]],
});

// The title in its two colours. Each letter sits GAP from the one before it where they come
// closest, as the artwork spaced OMEGA; the words sit as far apart as OMEGA and ZERO did.
const WORDS = [['C', 'A', 'R', 'T'], ['R', 'I', 'D', 'G', 'E']];
const GAP = 12, WORD_GAP = 32;
const START = 254.7;

// Extra room between letters on top of that: 3.5 is about 2 pixels on the boot screen.
// Letter n of the title moves right by at(n); things between letters use halves.
const TRACKING = 3.5;
const at = n => n * TRACKING;
// The outer ring's left and right edge at height y, by its crossings there.
function edges(ch, y) {
  const ring = GLYPHS[ch][0], xs = [];
  ring.forEach((p, i) => {
    const q = ring[(i + 1) % ring.length];
    if ((p[1] - y) * (q[1] - y) <= 0 && p[1] !== q[1]) xs.push(p[0] + (q[0] - p[0]) * (y - p[1]) / (q[1] - p[1]));
  });
  return xs.length ? [Math.min(...xs), Math.max(...xs)] : null;
}
// How far right of `a` the letter `b` must start to clear it by `gap`.
function advance(a, b, gap) {
  let most = -Infinity;
  for (let y = 170; y <= 277; y += 1) {
    const ea = edges(a, y), eb = edges(b, y);
    if (ea && eb) most = Math.max(most, ea[1] - eb[0]);
  }
  return most + gap;
}
let letterIndex = 0, cursor = START, previous = null;
const LAYOUT = WORDS.map(word => word.map((ch, i) => {
  if (previous) cursor += advance(previous, ch, i ? GAP : WORD_GAP);
  previous = ch;
  return [ch, cursor + at(letterIndex++)];
}));

// A border around the whole logo, as if it were cut out in one piece: 4.8 is about 3 pixels on
// the boot screen. A width of 0 leaves the logo without one.
const OUTLINE = { width: 4.8, color: '#ffffff' };

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('logo');
const defs = el('defs', {}, svg);
let uid = 0;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const f = v => +v.toFixed(2);
const pathOf = rings => rings.map(r => 'M' + r.map(p => f(p[0]) + ',' + f(p[1])).join('L') + 'Z').join('');

function gradient(type, attrs, stops) {
  const id = 'g' + (uid++);
  const g = el(type, Object.assign({ id, gradientUnits: 'userSpaceOnUse' }, attrs), defs);
  for (const [o, c, a] of stops) el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a ?? 1 }, g);
  return `url(#${id})`;
}
function clip(d, rule = 'nonzero') {
  const id = 'c' + (uid++);
  el('path', { d, 'clip-rule': rule }, el('clipPath', { id }, defs));
  return `url(#${id})`;
}

// ---------- geometry ----------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const norm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
const area = r => r.reduce((s, p, i) => { const q = r[(i + 1) % r.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0) / 2;

// Offsets a ring by d (d > 0 grows it). Returns, per edge, the inner edge,
// the matching outer edge, and the bevel triangles that fill sharp corners.
function offsetRing(ring, d, miterLimit = 2.2) {
  const n = ring.length, s = Math.sign(area(ring));
  const dirs = ring.map((p, i) => norm(sub(ring[(i + 1) % n], p)));
  const nrm = dirs.map(e => mul([e[1], -e[0]], s));        // outward normal of each edge
  const startOf = [], endOf = [], corners = [];
  for (let k = 0; k < n; k++) {
    const a = (k - 1 + n) % n, na = nrm[a], nb = nrm[k], p = ring[k];
    const gap = dot(dirs[a], nb) * d > 0;                    // offset edges separate at this corner
    const c = 1 + dot(na, nb);
    const miter = c > 1e-6 ? mul(add(na, nb), d / c) : null;
    if (miter && (!gap || Math.hypot(...miter) <= Math.abs(d) * miterLimit)) {
      const m = add(p, miter); endOf[a] = m; startOf[k] = m;
    } else {
      const pa = add(p, mul(na, d)), pb = add(p, mul(nb, d));
      endOf[a] = pa; startOf[k] = pb;
      corners.push({ tri: [p, pa, pb], n: norm(add(na, nb)) });
    }
  }
  const edges = ring.map((p, i) => ({
    quad: [p, ring[(i + 1) % n], endOf[i], startOf[i]],
    n: nrm[i],
  }));
  const outer = [];
  for (let i = 0; i < n; i++) { outer.push(startOf[i]); if (endOf[i] !== startOf[(i + 1) % n]) outer.push(endOf[i]); }
  return { edges, corners, outer };
}

// Merges vertices closer than min px: tiny edges invert once offset.
function cleanRing(ring, min = 2.5) {
  const r = ring.slice();
  for (let i = 0; i < r.length && r.length > 3;) {
    const j = (i + 1) % r.length;
    if (Math.hypot(...sub(r[j], r[i])) < min) { r[i] = mul(add(r[i], r[j]), 0.5); r.splice(j, 1); if (j < i) i--; }
    else i++;
  }
  return r;
}

// Rounded-corner closed path, used for the emblem's soft tips.
function roundedPath(pts, r) {
  const n = pts.length; let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const ra = Math.min(r, Math.hypot(...sub(a, p)) / 2), rb = Math.min(r, Math.hypot(...sub(b, p)) / 2);
    const p1 = add(p, mul(norm(sub(a, p)), ra)), p2 = add(p, mul(norm(sub(b, p)), rb));
    d += (i ? 'L' : 'M') + f(p1[0]) + ',' + f(p1[1]) + 'Q' + f(p[0]) + ',' + f(p[1]) + ' ' + f(p2[0]) + ',' + f(p2[1]);
  }
  return d + 'Z';
}

// ---------- chrome bevel ----------
const LIGHT = norm([-0.42, -0.9]);
const CHROME = [[-1, [104, 109, 122]], [-0.45, [160, 165, 178]], [0.1, [216, 219, 227]], [0.55, [244, 245, 249]], [1, [255, 255, 255]]];
function chrome(b, shift = 0) {
  b = Math.max(-1, Math.min(1, b + shift));
  for (let i = 1; i < CHROME.length; i++) {
    const [b0, c0] = CHROME[i - 1], [b1, c1] = CHROME[i];
    if (b <= b1) { const t = (b - b0) / (b1 - b0); return 'rgb(' + c0.map((v, j) => Math.round(v + (c1[j] - v) * t)).join(',') + ')'; }
  }
}
function facet(g, poly, n, inner, outer) {
  const b = dot(n, LIGHT);
  const fill = gradient('linearGradient',
    { x1: f(inner[0]), y1: f(inner[1]), x2: f(outer[0]), y2: f(outer[1]) },
    [[0, chrome(b, -0.6)], [0.25, chrome(b, -0.1)], [0.65, chrome(b, 0.35)], [1, chrome(b, 0)]]);
  el('path', { d: pathOf([poly]), fill, stroke: fill, 'stroke-width': 0.35, 'stroke-linejoin': 'round' }, g);
}

// A letter: chrome bevel of width w around the face, then the face itself.
function letter(parent, rings, w, faceFill) {
  rings = rings.map(r => cleanRing(r));
  const g = el('g', {}, parent);
  const big = Math.max(...rings.map(r => Math.abs(area(r))));
  const base = el('path', { fill: 'rgb(196,200,210)', 'fill-rule': 'evenodd', stroke: 'rgba(0,0,0,.7)', 'stroke-width': 0.8, 'stroke-linejoin': 'round' }, g);
  const outlines = [];
  for (const ring of rings) {
    const d = Math.abs(area(ring)) === big ? w : -w;        // counters bevel inwards
    const { edges, corners, outer } = offsetRing(ring, d);
    outlines.push(outer);
    const sd = Math.sign(d);
    for (const e of edges) {
      const [p0, p1, o1, o0] = e.quad;
      if (dot(sub(o1, o0), sub(p1, p0)) <= 0) continue;      // inverted at a tight corner; the base shows through
      facet(g, e.quad, mul(e.n, sd), mul(add(p0, p1), 0.5), mul(add(o0, o1), 0.5));
    }
    for (const c of corners) facet(g, c.tri, mul(c.n, sd), c.tri[0], mul(add(c.tri[1], c.tri[2]), 0.5));
  }
  base.setAttribute('d', pathOf(outlines));
  el('path', { d: pathOf(rings), fill: faceFill, 'fill-rule': 'evenodd',
    stroke: 'rgba(20,10,30,.55)', 'stroke-width': 0.9, 'stroke-linejoin': 'round' }, g);
  return g;
}

// ---------- the emblem behind the title ----------
const NAVY = '#0c037f';
function hourglass(top, bottom, lt, lb, rb, rt) {
  // each side is x = x0 + s * (y - y0)
  const X = (L, y) => L[0] + L[2] * (y - L[1]);
  const meet = (A, B) => { const y = (B[0] - A[0] - B[2] * B[1] + A[2] * A[1]) / (A[2] - B[2]); return [X(A, y), y]; };
  return [[X(lt, top), top], [X(rt, top), top], meet(rt, rb), [X(rb, bottom), bottom], [X(lb, bottom), bottom], meet(lt, lb)];
}
const side = (L, dx) => [L[0] + dx, L[1], L[2]];
const LT = [439, 64, 1.36], LB = [474, 299, -1.18], RB = [805, 299, 1.38], RT = [974, 64, -1.08];
const navyPoly = hourglass(64, 377, LT, LB, RB, RT);
const linePoly = hourglass(74.5, 366, side(LT, 18.5), side(LB, 12.5), side(RB, -19.5), side(RT, -17));
const orangePoly = hourglass(78.5, 360.5, side(LT, 32), side(LB, 21), side(RB, -31), side(RT, -29));

function convexHull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const chain = pts => {
    const h = [];
    for (const q of pts) { while (h.length > 1 && cross(h[h.length - 2], h[h.length - 1], q) <= 0) h.pop(); h.push(q); }
    return h.slice(0, -1);
  };
  return chain(p).concat(chain(p.reverse()));
}
const place = (ch, x) => GLYPHS[ch].map(r => r.map(([px, py]) => [px + x, py]));

// The plate is the hull of the letters grown by one margin, so the black border
// between the chrome and the rim has the same width all the way round:
// 6 of chrome bevel, about 5 of black, then the rim.
const PLATE_MARGIN = 14.5;
const PLATE = offsetRing(convexHull(LAYOUT.flat().flatMap(([ch, x]) => place(ch, x).flat())), PLATE_MARGIN, 4).outer;
const plateEdgeAt = (x, pick) => pick(...PLATE.flatMap((p, i) => {   // y where the plate outline crosses x
  const q = PLATE[(i + 1) % PLATE.length];
  return (p[0] - x) * (q[0] - x) <= 0 && p[0] !== q[0] ? [p[1] + (q[1] - p[1]) * (x - p[0]) / (q[0] - p[0])] : [];
}));

// The emblem slides sideways so its middle sits under the middle of the title,
// and the view is framed around both.
const EMBLEM_CX = 676, EMBLEM_LEFT = 380, EMBLEM_RIGHT = 974;
const plateXs = PLATE.map(p => p[0]);
const titleCx = (Math.min(...plateXs) + Math.max(...plateXs)) / 2;
const shiftX = titleCx - EMBLEM_CX;
const left = Math.min(...plateXs, EMBLEM_LEFT + shiftX), right = Math.max(...plateXs, EMBLEM_RIGHT + shiftX);
svg.setAttribute('viewBox', `${f(left - 34)} 10 ${f(right - left + 68)} 430`);

// On a fixed screen, ?pixel=2 lays the logo out on blocks of 2x2 of its pixels: the page is
// w/2 x h/2 and the caller blows it up without smoothing. SCREEN maps units to page pixels, so
// the finest lines can land on whole pixels instead of smearing across two.
const query = new URLSearchParams(location.search);
const SCREEN = query.has('w') ? (() => {
  const p = +query.get('pixel') || 1;
  const W = +query.get('w') / p, H = +query.get('h') / p;
  const k = (+query.get('logo') || W * p * 0.8) / p / (right - left);   // page pixels per unit
  const x0 = titleCx - W / k / 2, y0 = 225 - H / k / 2;
  svg.setAttribute('viewBox', `${x0} ${y0} ${W / k} ${H / k}`);
  // pinned to the top left, so a window bigger than the screen (Chrome won't go below 500px
  // wide) only adds room to crop off
  Object.assign(svg.style, { position: 'fixed', left: '0', top: '0', width: `${W}px`, height: `${H}px`, maxWidth: 'none' });
  document.documentElement.style.setProperty('--grid-step', `${40 / p}px`);
  document.documentElement.style.setProperty('--grid-line', `${2 / p}px`);
  // In blocks the logo is drawn alone, on nothing and without its border: the build puts the
  // border round it and the grid behind it in whole pixels.
  if (p > 1) document.documentElement.style.background = 'transparent';
  return { k, x0, y0, p };
})() : null;
const toPixel = ([x, y]) => [(x - SCREEN.x0) * SCREEN.k, (y - SCREEN.y0) * SCREEN.k];
const fromPixel = ([X, Y]) => [X / SCREEN.k + SCREEN.x0, Y / SCREEN.k + SCREEN.y0];

// The border is every piece of the silhouette drawn again behind the logo, stroked wide.
const border = el('g', { fill: OUTLINE.color, stroke: OUTLINE.color, 'stroke-width': 2 * OUTLINE.width, 'stroke-linejoin': 'round' }, svg);
const blocks = SCREEN && SCREEN.p > 1;
const silhouette = (tag, attrs, parent = border) => OUTLINE.width > 0 && !blocks && el(tag, attrs, parent);

const emblem = el('g', { transform: `translate(${f(shiftX)} 0)` }, svg);
const emblemBorder = el('g', { transform: `translate(${f(shiftX)} 0)` }, border);
const DISC = { cx: 675, cy: 225, r: 183 };
const discD = `M${DISC.cx - DISC.r},${DISC.cy}a${DISC.r},${DISC.r} 0 1,0 ${2 * DISC.r},0a${DISC.r},${DISC.r} 0 1,0 ${-2 * DISC.r},0Z`;
// Wedges at two tips of the hourglass bite into the disc behind it. With a border they take its
// colour, since a pocket of background inside the border would read as a hole; without one they
// are cut out of the disc, so the background shows through.
const WEDGES = 'M439,64 L553,184 L602,184 Z M911,377 L784,257 L745,257 Z';
if (OUTLINE.width > 0) {
  el('circle', { ...DISC, fill: NAVY }, emblem);
  el('path', { d: WEDGES, fill: OUTLINE.color, 'clip-path': clip(discD) }, emblem);
} else {
  el('circle', { ...DISC, fill: NAVY, 'clip-path': clip('M0,0H1400V500H0Z' + WEDGES, 'evenodd') }, emblem);
}
silhouette('circle', DISC, emblemBorder);
const navyD = roundedPath(navyPoly, 2);
el('path', { d: navyD, fill: NAVY }, emblem);
silhouette('path', { d: navyD }, emblemBorder);
const orangeD = roundedPath(orangePoly, 5);
el('path', { d: orangeD, fill: gradient('radialGradient', { cx: 690, cy: 215, r: 330 },
  [[0, '#ffc23e'], [0.18, '#ff9a22'], [0.38, '#fb6410'], [0.6, '#f4380c'], [1, '#dc1a0c']]) }, emblem);

// circuit-board traces etched into the orange
(function circuits() {
  const g = el('g', { 'clip-path': clip(orangeD) }, emblem);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // On a fixed screen every trace is one pixel wide, its runs flat and its turns at 45 degrees on
  // pixel centres, and its highlight is the pixel row below: thinner than that only smears.
  const px = SCREEN ? 1 / SCREEN.k : 0;
  const [darkW, liteW, liteShift, padW] = SCREEN ? [px, px, `0 ${px}`, px] : [3, 1.3, '.9 1.3', 1.8];
  const dark = el('g', { fill: 'none', stroke: '#c81404', 'stroke-opacity': 0.7, 'stroke-width': darkW, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const lite = el('g', { fill: 'none', stroke: '#ffc060', 'stroke-opacity': 0.85, 'stroke-width': liteW, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: `translate(${liteShift})` }, g);
  const pads = el('g', { fill: 'none', stroke: '#d81c08', 'stroke-opacity': 0.6, 'stroke-width': padW }, g);
  const onPixels = pts => {
    const shift = ([x, y]) => [x + shiftX, y];
    let [X, Y] = toPixel(shift(pts[0])).map(v => Math.floor(v) + 0.5);
    const out = [[X, Y]];
    for (let i = 1; i < pts.length; i++) {
      const dx = (pts[i][0] - pts[i - 1][0]) * SCREEN.k, dy = (pts[i][1] - pts[i - 1][1]) * SCREEN.k;
      if (Math.abs(dy) < 1e-9) X += Math.round(dx);
      else { const d = Math.max(1, Math.round(Math.abs(dy))); X += Math.sign(dx) * d; Y += Math.sign(dy) * d; }
      out.push([X, Y]);
    }
    return out.map(P => { const [x, y] = fromPixel(P); return [x - shiftX, y]; });
  };
  if (blocks) lite.remove();                                  // in blocks a trace is a lone line
  for (let i = 0, n = blocks ? 45 : 110; i < n; i++) {
    let x = 380 + rnd() * 600, y = 70 + rnd() * 300;
    const dir = rnd() < 0.5 ? -1 : 1, lanes = 1 + Math.floor(rnd() * 3);
    const pts = [[x, y]];
    for (let s = 0, n = 2 + Math.floor(rnd() * 4); s < n; s++) {
      x += dir * (14 + rnd() * 50); pts.push([x, y]);
      if (s < n - 1) { const j = (rnd() < 0.5 ? -1 : 1) * (6 + rnd() * 16); x += dir * Math.abs(j); y += j; pts.push([x, y]); }
    }
    for (let l = 0; l < lanes; l++) {
      const lane = pts.map(p => [p[0], p[1] + l * 5.5]);
      const d = 'M' + (SCREEN ? onPixels(lane) : lane).map(p => f(p[0]) + ',' + f(p[1])).join('L');
      el('path', { d }, dark); el('path', { d }, lite);
      if (rnd() < 0.55) { const e = pts[pts.length - 1]; el('circle', { cx: f(e[0] + dir * 3), cy: f(e[1] + l * 5.5), r: 2.4 }, pads); }
    }
  }
  for (let i = 0; i < 7; i++) el('circle', { cx: f(420 + rnd() * 520), cy: f(80 + rnd() * 280), r: f(5 + rnd() * 9) }, pads);
})();

el('path', { d: roundedPath(linePoly, 6), fill: 'none', stroke: '#fff', 'stroke-width': 3 }, emblem);
// the two slanted cuts that turn the hourglass into a Z
for (const cut of [[[621, 130], [695, 130], [647, 170], [573, 170]], [[702.5, 276], [772.5, 276], [733, 309.5], [663, 309.5]]]) {
  el('path', { d: roundedPath(cut, 2), fill: NAVY }, emblem);
  el('path', { d: roundedPath(offsetRing(cut, -4.5).outer, 3), fill: 'none', stroke: '#fff', 'stroke-width': 3 }, emblem);
}

// ---------- black plate with a silver rim ----------
const plateD = pathOf([PLATE]);
silhouette('path', { d: plateD });
const plate = el('g', {}, svg);
el('path', { d: plateD, fill: '#141519', stroke: '#141519', 'stroke-width': 1, 'stroke-linejoin': 'miter' }, plate);
const rim = el('g', { 'clip-path': clip(plateD) }, plate);
el('path', { d: plateD, fill: 'none', stroke: gradient('linearGradient', { x1: 0, y1: 150, x2: 0, y2: 296 },
  [[0, '#ffffff'], [0.5, '#9aa0ad'], [1, '#e4e7ee']]), 'stroke-width': 7.5 }, rim);
el('path', { d: plateD, fill: 'none', stroke: '#141519', 'stroke-width': 4.2 }, rim);

// ---------- lettering ----------
const blue = gradient('linearGradient', { x1: 0, y1: 166, x2: 0, y2: 282 },
  [[0, '#061a50'], [0.1, '#04327c'], [0.2, '#043f84'], [0.3, '#074e8e'], [0.4, '#065f9c'], [0.5, '#076ea7'],
   [0.6, '#087eb1'], [0.7, '#0b93bf'], [0.8, '#0aa7cf'], [1, '#10b2d6']]);
const fire = gradient('linearGradient', { x1: 0, y1: 166, x2: 0, y2: 282 },
  [[0, '#e41c14'], [0.1, '#ec2915'], [0.2, '#ef3e16'], [0.3, '#f05a19'], [0.4, '#f47a1a'], [0.5, '#f6a01a'],
   [0.6, '#f6c315'], [0.7, '#f9e012'], [0.8, '#fce90b'], [1, '#f9e320']]);
const words = el('g', {}, svg);
LAYOUT.forEach((word, i) => {
  for (const [ch, x] of word) letter(words, place(ch, x), 6, i ? fire : blue);
});

// the little chrome chip wedged between the two words
// drawn where it sat before ZERO's Z, at 567.4, and moved to the second word
const chip = el('g', { transform: `translate(${f(LAYOUT[1][0][1] - 567.4 - at(0.5))} 0)` }, words);
el('path', { d: 'M587,207 L602,207 L583,228 Z', fill: gradient('linearGradient', { x1: 590, y1: 207, x2: 588, y2: 228 },
  [[0, '#8f86a8'], [0.45, '#f6efe0'], [1, '#d9c9b4']]) }, chip);
el('path', { d: 'M601,202 L587,202 Q585,202 584,204 L575.5,229', fill: 'none', stroke: '#c98b5c', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, chip);
el('path', { d: 'M602,208.5 L605,210 L580,237.5 L577,236 Z', fill: '#d8814c', stroke: '#2a1408', 'stroke-width': 0.6 }, chip);

// ---------- light: two flares and two glints ----------
const glow = el('g', { style: 'mix-blend-mode:screen' }, svg);
// the bursts belong to the emblem's centre, so they moved with it
for (const [cx, cy, rx, ry] of [[706 + shiftX, 148, 110, 58], [598 + shiftX, 303, 90, 42]])
  el('ellipse', { cx, cy, rx, ry, fill: gradient('radialGradient', { cx: 0, cy: 0, r: 1, gradientTransform: `translate(${cx} ${cy}) scale(${rx} ${ry})` },
    [[0, '#ffffff'], [0.12, '#fffbe0'], [0.32, '#ffe24a', 0.75], [0.62, '#ffa818', 0.3], [1, '#ff8000', 0]]) }, glow);
// glints catch the rim: one on the plate's top-right corner, one on its bottom edge
const ray = gradient('radialGradient', { cx: 0, cy: 0, r: 1, gradientTransform: 'scale(16 2.2)' }, [[0, '#ffffff'], [0.5, '#fff6c8', 0.7], [1, '#ffd060', 0]]);
const corner = PLATE.reduce((a, p) => (p[0] - p[1] > a[0] - a[1] ? p : a));
for (const [x, y, size] of [[corner[0] - 3, corner[1] + 3, 1.2], [729 + at(6.5), plateEdgeAt(729 + at(6.5), Math.max) - 3, 1]]) {
  const glint = el('g', { transform: `translate(${f(x)} ${f(y)}) scale(${size})` }, glow);
  el('ellipse', { rx: 16, ry: 2.2, fill: ray }, glint);
  el('ellipse', { rx: 16, ry: 2.2, fill: ray, transform: 'rotate(90) scale(.9 1)' }, glint);
}

</script>
