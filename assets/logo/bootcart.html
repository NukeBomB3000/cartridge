<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge boot cart</title>
<!--
  The boot logo: a Game Boy Advance cart in the shelf's grey, the shelf's own silhouette, ridges
  and GAME BOY ADVANCE lettering (cartridge-ui/assets), with a label in the style of Apotris's: CARTRIDGE spelt in tetromino blocks over a stack of settled pieces.
  ?w=720&h=480 frames it for a panel; bootcart.sh renders the boot images from it.
-->
<style>
  :root { --bg: #050508; --grid: #1c1c1e; --step: 40px; --line: 2px; }
  html {
    background-color: var(--bg);
    background-image:
      linear-gradient(to right, var(--grid) var(--line), transparent var(--line)),
      linear-gradient(to bottom, var(--grid) var(--line), transparent var(--line));
    background-size: var(--step) var(--step);
  }
  html, body { margin: 0; overflow: hidden; }
  svg { position: fixed; display: block; }
</style>
</head>
<body>

    </g>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0.5" stop-color="#43464e"/>
      <stop offset="1" stop-color="#2f3238"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">

      <stop offset="1" stop-color="#d4d7de"/>
    </linearGradient>
    <mask id="letters" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="141">
      <image href="../../crates/cartridge-ui/assets/lettering_gba.png" width="240" height="141"/>
    </mask>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <path d="M 10.72 0.00 C 10.62 0.00 10.52 0.02 10.42 0.05 L 7.52 0.82 C 7.42 0.85 7.33 0.89 7.24 0.95 L 5.14 2.16 C 5.05 2.21 4.98 2.27 4.91 2.34 L 3.13 4.11 C 3.06 4.18 3.00 4.26 2.94 4.34 L 1.21 7.37 C 1.16 7.45 1.12 7.54 1.09 7.64 L 0.04 11.56 C 0.01 11.65 0.00 11.76 0.00 11.85 L 0.00 25.57 C 0.00 25.77 0.05 25.96 0.15 26.14 L 1.13 27.83 C 1.28 28.09 1.53 28.28 1.82 28.36 L 3.63 28.84 C 3.73 28.87 3.83 28.89 3.93 28.89 L 6.49 28.89 L 6.49 136.73 C 6.50 136.93 6.55 137.13 6.65 137.3 L 7.65 139.04 C 7.75 139.21 7.89 139.35 8.07 139.45 L 10.49 140.85 C 10.66 140.95 10.86 141 11.06 141 L 82.44 141 L 157.56 141 L 228.94 141 C 229.14 141 229.34 140.95 229.51 140.85 L 231.93 139.45 C 232.10 139.35 232.24 139.21 232.34 139.04 L 233.35 137.3 C 233.45 137.13 233.50 136.93 233.50 136.73 L 233.50 28.89 L 236.06 28.89 C 236.16 28.89 236.26 28.87 236.36 28.84 L 238.17 28.36 C 238.46 28.28 238.71 28.09 238.86 27.83 L 239.84 26.14 C 239.94 25.97 240.00 25.77 240.00 25.57 L 240.00 11.85 C 240.00 11.75 239.99 11.65 239.96 11.56 L 238.91 7.64 C 238.88 7.54 238.85 7.45 238.80 7.37 L 237.05 4.34 C 237.00 4.26 236.94 4.18 236.87 4.11 L 235.10 2.34 C 235.03 2.27 234.95 2.21 234.86 2.16 L 232.75 0.95 C 232.67 0.90 232.58 0.85 232.48 0.82 L 229.58 0.05 C 229.48 0.02 229.39 0.00 229.29 0.00 L 153.74 0.00 L 86.25 0.00 L 10.72 0.00 Z" fill="url(#shell)" stroke="#1a1b1f" stroke-width="1" filter="url(#drop)"/>
  <path d="M 10.72 0.00 C 10.62 0.00 10.52 0.02 10.42 0.05 L 7.52 0.82 C 7.42 0.85 7.33 0.89 7.24 0.95 L 5.14 2.16 C 5.05 2.21 4.98 2.27 4.91 2.34 L 3.13 4.11 C 3.06 4.18 3.00 4.26 2.94 4.34 L 1.21 7.37 C 1.16 7.45 1.12 7.54 1.09 7.64 L 0.04 11.56 C 0.01 11.65 0.00 11.76 0.00 11.85 L 0.00 25.57 C 0.00 25.77 0.05 25.96 0.15 26.14 L 1.13 27.83 C 1.28 28.09 1.53 28.28 1.82 28.36 L 3.63 28.84 C 3.73 28.87 3.83 28.89 3.93 28.89 L 6.49 28.89 L 6.49 136.73 C 6.50 136.93 6.55 137.13 6.65 137.3 L 7.65 139.04 C 7.75 139.21 7.89 139.35 8.07 139.45 L 10.49 140.85 C 10.66 140.95 10.86 141 11.06 141 L 82.44 141 L 157.56 141 L 228.94 141 C 229.14 141 229.34 140.95 229.51 140.85 L 231.93 139.45 C 232.10 139.35 232.24 139.21 232.34 139.04 L 233.35 137.3 C 233.45 137.13 233.50 136.93 233.50 136.73 L 233.50 28.89 L 236.06 28.89 C 236.16 28.89 236.26 28.87 236.36 28.84 L 238.17 28.36 C 238.46 28.28 238.71 28.09 238.86 27.83 L 239.84 26.14 C 239.94 25.97 240.00 25.77 240.00 25.57 L 240.00 11.85 C 240.00 11.75 239.99 11.65 239.96 11.56 L 238.91 7.64 C 238.88 7.54 238.85 7.45 238.80 7.37 L 237.05 4.34 C 237.00 4.26 236.94 4.18 236.87 4.11 L 235.10 2.34 C 235.03 2.27 234.95 2.21 234.86 2.16 L 232.75 0.95 C 232.67 0.90 232.58 0.85 232.48 0.82 L 229.58 0.05 C 229.48 0.02 229.39 0.00 229.29 0.00 L 153.74 0.00 L 86.25 0.00 L 10.72 0.00 Z" fill="none" stroke="#7d828c" stroke-width="0.6" transform="translate(0.5 0.5)" opacity="0.6"/>
  <!-- ridges and the cut, lit from the top left as the shelf lights them -->
  <g fill="#fff" opacity="0.18"><use href="#ridge" x="-1" y="-1"/><use href="#cut" x="1" y="1"/></g>
  <g fill="#000" opacity="0.45"><use href="#ridge"/><use href="#cut"/></g>
  <!-- the lettering pressed into the plastic: a dark edge below, the face a shade lighter -->
  <g mask="url(#letters)">
    <rect x="0" y="0.6" width="240" height="141" fill="#1d1f23" opacity="0.8"/>
  </g>
  <g mask="url(#letters)" transform="translate(0 -0.5)">
    <rect x="0" y="0" width="240" height="141" fill="#6b707a"/>
  </g>
  <!-- the label's well, then the label, drawn by the script below -->
  <rect x="30.4" y="30.6" width="181.6" height="95.8" rx="3" fill="#25272c"/>
  <rect x="30.4" y="30.6" width="181.6" height="95.8" rx="3" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1"/>
  <g id="label"></g>
</svg>
<script>
// The label, after Apotris's: a dark playfield, CARTRIDGE in bevelled tetromino blocks, a stack
// of settled pieces under it.
{
  const FONT = {
    C: ['111', '100', '100', '100', '111'],
    A: ['111', '101', '111', '101', '101'],
    R: ['110', '101', '110', '101', '101'],
    T: ['111', '010', '010', '010', '010'],
    I: ['111', '010', '010', '010', '111'],
    D: ['110', '101', '101', '101', '110'],
    G: ['111', '100', '101', '101', '111'],
    E: ['111', '100', '110', '100', '111'],
  };
  // the guideline's colours: I, O, T, S, Z, J, L
  const COLOURS = ['#2fd0e8', '#f2d024', '#a24bd6', '#4cc552', '#e8403c', '#3a5fe0', '#f08a24'];
  const X0 = 32.4, Y0 = 32.6, W = 177.6, H = 91.8, CELL = 4.8, BEVEL = CELL * 0.22;
  const shade = (hex, f) => '#' + [1, 3, 5].map(i => {
    const c = parseInt(hex.slice(i, i + 2), 16);
    return Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)).toString(16).padStart(2, '0');
  }).join('');
  const n = v => v.toFixed(2);
  let svg = `<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" rx="2" fill="#0a0a1c"/><g stroke="#fff" stroke-opacity="0.05" stroke-width="0.25">`;
  for (let i = 1; i * CELL < W; i++) svg += `<path d="M${n(X0 + i * CELL)} ${Y0}v${H}"/>`;
  for (let j = 1; j * CELL < H; j++) svg += `<path d="M${X0} ${n(Y0 + j * CELL)}h${W}"/>`;
  svg += '</g>';
  const block = (x, y, colour) => {
    const s = CELL, b = BEVEL, hi = shade(colour, 0.55), lo = shade(colour, -0.4);
    return `<rect x="${n(x)}" y="${n(y)}" width="${n(s)}" height="${n(s)}" fill="${colour}"/>` +
      `<path d="M${n(x)} ${n(y)}h${n(s)}l${n(-b)} ${n(b)}h${n(-(s - 2 * b))}v${n(s - 2 * b)}l${n(-b)} ${n(b)}z" fill="${hi}"/>` +
      `<path d="M${n(x + s)} ${n(y + s)}h${n(-s)}l${n(b)} ${n(-b)}h${n(s - 2 * b)}v${n(-(s - 2 * b))}l${n(b)} ${n(-b)}z" fill="${lo}"/>`;
  };
  const word = 'CARTRIDGE';
  const left = X0 + (W - (word.length * 4 - 1) * CELL) / 2, top = Y0 + 4 * CELL;
  [...word].forEach((ch, k) => FONT[ch].forEach((row, r) => [...row].forEach((bit, c) => {
    if (bit === '1') svg += block(left + (k * 4 + c) * CELL, top + r * CELL, COLOURS[k % COLOURS.length]);
  })));
  // settled pieces along the bottom: a ragged skyline of columns, with a hole here and there
  const cols = Math.floor(W / CELL), base = X0 + (W - cols * CELL) / 2;
  for (let i = 0; i < cols; i++) {
    const height = 1 + ((i * 7 + 3) % 5 === 0 ? 2 : (i * 5) % 3 === 0 ? 1 : 0);
    for (let j = 0; j < height; j++) {
      if ((i * 11 + j * 7) % 13 === 5) continue;
      svg += block(base + i * CELL, Y0 + H - (j + 1) * CELL - 1.6, COLOURS[(i + j * 3 + Math.floor(i / 4)) % COLOURS.length]);
    }
  }
  document.getElementById('label').innerHTML = svg;
}
// &scale=4 draws it that many times the panel's size, the grid with it, for a box filter.
const scale = +new URLSearchParams(location.search).get('scale') || 1;
document.documentElement.style.setProperty('--step', `${40 * scale}px`);
document.documentElement.style.setProperty('--line', `${2 * scale}px`);
// On a fixed screen the cart is `cart` of the width across (0.62 by default), in the middle.
const q = new URLSearchParams(location.search);
const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight;
const share = +q.get('cart') || 0.62;
const svg = document.getElementById('cart');
const w = Math.min(W * share, H * 0.8 * 252 / 155), h = w * 155 / 252;
Object.assign(svg.style, { width: `${w}px`, height: `${h}px`, left: `${(W - w) / 2}px`, top: `${(H - h) / 2}px` });
</script>
</body>
</html>
