[package]
name = "cartridge"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "cartridge-gfx/host"]
device = ["cartridge-gfx/device"]

[dependencies]
cartridge-cheevos = { path = "../cartridge-cheevos" }
cartridge-gfx = { path = "../cartridge-gfx", default-features = false }
cartridge-input = { path = "../cartridge-input" }
cartridge-power = { path = "../cartridge-power" }
cartridge-retro = { path = "../cartridge-retro" }
cartridge-store = { path = "../cartridge-store" }
cartridge-ui = { path = "../cartridge-ui" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }

[dev-dependencies]
cartridge-gfx = { path = "../cartridge-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
