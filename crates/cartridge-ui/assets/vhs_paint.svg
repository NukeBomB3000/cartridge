  <rect x="53.4" y="98" width="3.2" height="3.5" fill="#e8e8e4" transform="rotate(0 55 105)"/><rect x="53.4" y="98" width="3.2" height="3.5" fill="#e8e8e4" transform="rotate(60 55 105)"/><rect x="53.4" y="98" width="3.2" height="3.5" fill="#e8e8e4" transform="rotate(120 55 105)"/><rect x="53.4" y="98" width="3.2" height="3.5" fill="#e8e8e4" transform="rotate(180 55 105)"/><rect x="53.4" y="98" width="3.2" height="3.5" fill="#e8e8e4" transform="rotate(240 55 105)"/><rect x="53.4" y="98" width="3.2" height="3.5" fill="#e8e8e4" transform="rotate(300 55 105)"/>
  <circle cx="318" cy="105" r="16" fill="#26272b"/>
