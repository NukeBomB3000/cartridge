<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 140">
  <!-- the card's edge is rounded over: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="6" width="1.5" height="128" fill="#fff" fill-opacity="0.4"/>
  <rect x="6" y="0" width="120" height="1.5" fill="#fff" fill-opacity="0.35"/>
  <rect x="130.5" y="6" width="1.5" height="128" fill="#000" fill-opacity="0.4"/>
  <rect x="6" y="138.5" width="120" height="1.5" fill="#000" fill-opacity="0.3"/>
  <!-- the label's well, over nearly all the face: a shadow along its top and left, a lit lip under it and to its right -->
  <rect x="12" y="4.6" width="108" height="1.1" fill="#000" fill-opacity="0.4"/>
  <rect x="12" y="5.7" width="1.1" height="117.2" fill="#000" fill-opacity="0.35"/>
  <rect x="13.1" y="122.9" width="106.9" height="1.1" fill="#fff" fill-opacity="0.35"/>
  <rect x="118.9" y="5.7" width="1.1" height="118" fill="#fff" fill-opacity="0.3"/>
  <!-- the grip groove across the foot, and the arrow moulded under it pointing into the slot -->
  <rect x="34" y="126.2" width="64" height="1.2" fill="#000" fill-opacity="0.38"/>
  <rect x="34" y="127.4" width="64" height="0.9" fill="#fff" fill-opacity="0.3"/>
  <polygon points="60,130 72,130 66,135.6" fill="#000" fill-opacity="0.32"/>
  <polygon points="61.4,130 70.6,130 66,134.4" fill="#fff" fill-opacity="0.12"/>
</svg>
