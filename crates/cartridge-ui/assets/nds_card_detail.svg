<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 140">
  <!-- the card's edge is rounded over: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="6" width="1.5" height="128" fill="#fff" fill-opacity="0.4"/>
  <rect x="6" y="0" width="120" height="1.5" fill="#fff" fill-opacity="0.35"/>
  <rect x="130.5" y="6" width="1.5" height="128" fill="#000" fill-opacity="0.4"/>
  <rect x="6" y="138.5" width="120" height="1.5" fill="#000" fill-opacity="0.3"/>
  <!-- the label's well, across nearly all the face: a shadow along its top and left, a lit lip under it and to its right -->
  <rect x="6.5" y="11.5" width="119" height="1.2" fill="#000" fill-opacity="0.4"/>
  <rect x="6.5" y="12.7" width="1.2" height="101" fill="#000" fill-opacity="0.35"/>
  <rect x="7.7" y="113.7" width="117.8" height="1.2" fill="#fff" fill-opacity="0.35"/>
  <rect x="124.3" y="12.7" width="1.2" height="102" fill="#fff" fill-opacity="0.3"/>
  <!-- the grip groove across the foot, and the arrow moulded under it pointing into the slot -->
  <rect x="30" y="121" width="72" height="1.4" fill="#000" fill-opacity="0.38"/>
  <rect x="30" y="122.4" width="72" height="1" fill="#fff" fill-opacity="0.3"/>
  <polygon points="59,127 73,127 66,134" fill="#000" fill-opacity="0.32"/>
  <polygon points="60.5,127 71.5,127 66,132.5" fill="#fff" fill-opacity="0.12"/>
</svg>
