<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 344">
  <!-- the cart's edges roll back: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="8" width="5" height="330" fill="#fff" fill-opacity="0.3"/>
  <rect x="8" y="0" width="280" height="4" fill="#fff" fill-opacity="0.3"/>
  <rect x="291" y="8" width="5" height="330" fill="#000" fill-opacity="0.45"/>
  <rect x="6" y="340" width="284" height="4" fill="#000" fill-opacity="0.35"/>
  <!-- the grip notches down either side -->
  <g fill="#000" fill-opacity="0.4">
    <rect x="0" y="40" width="8" height="4"/><rect x="0" y="56" width="8" height="4"/>
    <rect x="0" y="72" width="8" height="4"/><rect x="0" y="88" width="8" height="4"/>
    <rect x="288" y="40" width="8" height="4"/><rect x="288" y="56" width="8" height="4"/>
    <rect x="288" y="72" width="8" height="4"/><rect x="288" y="88" width="8" height="4"/>
  </g>
  <!-- the label's well over the top of the face -->
  <rect x="18" y="10" width="260" height="3" fill="#000" fill-opacity="0.45"/>
  <rect x="18" y="13" width="3" height="210" fill="#000" fill-opacity="0.4"/>
  <rect x="21" y="223" width="257" height="3" fill="#fff" fill-opacity="0.25"/>
  <rect x="275" y="13" width="3" height="210" fill="#fff" fill-opacity="0.22"/>
  <!-- the step along the foot, over the contacts -->
  <rect x="20" y="318" width="256" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="20" y="321" width="256" height="2" fill="#fff" fill-opacity="0.15"/>
</svg>
